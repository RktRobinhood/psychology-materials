name: Something broke
description: A button, game, timer, sound, the PDF, or the layout is not working.
title: "[Bug] "
labels: ["bug", "student report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. A short, clear report is perfect. Please do **not** write your full name, email or any other personal details here: this page is public.
  - type: input
    id: lesson
    attributes:
      label: Lesson
      description: Which lesson were you using?
      placeholder: e.g. Memory Quest
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the lesson?
      description: Chapter, station, lock or screen.
      placeholder: e.g. Chapter 3, screen 4
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do just before it went wrong, and what did you see?
      placeholder: I pressed Continue after the digit-span game and the screen went blank.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here or paste it. Crop out anything personal.
  - type: textarea
    id: device
    attributes:
      label: Device and browser
      description: Filled in for you when you use the lesson's Report a problem button.
      placeholder: e.g. Chrome on a school laptop, Safari on iPad

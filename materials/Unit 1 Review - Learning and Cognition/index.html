<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odyssey: The Long Way Home (Unit 1 Review)</title>
  <meta name="description" content="A fully voiced, branching Odyssey adventure that reviews all of Unit 1 Learning and Cognition for IB Psychology Paper 1: conditioning, social learning, schema theory, memory models, cognitive load, dual process theory and biases.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/ui/narrator-medallion.svg">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <button id="homeBtn" class="brand" type="button" title="Home">
        <img src="assets/ui/narrator-medallion.svg" alt="" width="30" height="30">
        <span class="brand-text">Odyssey</span>
      </button>
      <div id="hud" class="hud" hidden>
        <span class="hud-ep" id="hudEp"></span>
        <span class="hud-stat" id="hudCrew" title="Crew: your lives. A wrong quick-time answer costs one."></span>
        <span class="hud-stat" id="hudCoins" title="Drachmae: spend them at the Chronicler's stall."></span>
        <span class="hud-stat hud-wrath" id="hudWrath" title="Poseidon's wrath: hubris makes his tests faster."></span>
        <span class="hud-items" id="hudItems"></span>
        <button class="hud-item hud-bag" id="hudBag" type="button" title="Your satchel" aria-label="Your satchel" hidden></button>
      </div>
      <nav class="top-actions">
        <button id="logBtn" class="icon-btn" type="button" title="Dialogue log" aria-label="Dialogue log" hidden></button>
        <button id="mapBtn" class="icon-btn" type="button" title="Voyage map" aria-label="Voyage map"></button>
        <button id="soundBtn" class="icon-btn" type="button" title="Sound" aria-label="Sound"></button>
        <button id="menuBtn" class="icon-btn" type="button" title="Menu" aria-label="Menu"></button>
      </nav>
    </header>
    <main id="view" class="view"></main>
  </div>

  <dialog id="menuDlg" class="dlg">
    <div class="dlg-inner">
      <div class="dlg-head"><h2>Menu</h2><button class="icon-btn close-btn" type="button" data-close aria-label="Close">&times;</button></div>
      <div class="menu-grid" id="menuGrid"></div>
      <a class="report-link" href="https://github.com/RktRobinhood/psychology-materials/issues/new/choose" target="_blank" rel="noopener" data-report-problem>Report a problem</a>
    </div>
  </dialog>
  <dialog id="modalDlg" class="dlg dlg-wide">
    <div class="dlg-inner">
      <div class="dlg-head"><h2 id="modalTitle"></h2><button class="icon-btn close-btn" type="button" data-close aria-label="Close">&times;</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="printSheet" class="print-sheet"></div>

  <script src="data/cast.js"></script>
  <script src="data/sprites.js"></script>
  <script src="data/topics.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/exam.js"></script>
  <script src="data/episodes/ep1-troy.js"></script>
  <script src="data/episodes/ep2-lotus.js"></script>
  <script src="data/episodes/ep3-cyclops.js"></script>
  <script src="data/episodes/ep4-circe.js"></script>
  <script src="data/episodes/ep5-underworld.js"></script>
  <script src="data/episodes/ep6-sirens.js"></script>
  <script src="data/episodes/ep7-strait.js"></script>
  <script src="data/episodes/ep8-ithaca.js"></script>
  <script src="data/voice-manifest.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/qbank.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/story.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/trials.js"></script>
  <script src="js/evidence.js"></script>
  <script src="js/app.js"></script>
  <script defer src="../shared/report-problem.js" data-lesson="Odyssey: Unit 1 Review"></script>
</body>
</html>

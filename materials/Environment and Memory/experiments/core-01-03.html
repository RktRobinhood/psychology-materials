function controller(){const ctl={timers:[],raf:[],listeners:[],running:true,abort:null};ctl.after=(fn,ms)=>{const id=setTimeout(()=>{if(ctl.running)fn()},ms);ctl.timers.push(id);return id;};ctl.every=(fn,ms)=>{let id=setInterval(()=>{if(ctl.running)fn()},ms);ctl.timers.push({interval:id});return id;};ctl.frame=fn=>{const id=requestAnimationFrame(fn);ctl.raf.push(id);return id;};ctl.listen=(el,type,fn,opts)=>{el.addEventListener(type,fn,opts);ctl.listeners.push([el,type,fn,opts]);};ctl.clean=()=>{ctl.running=false;ctl.timers.forEach(id=>typeof id==='object'?clearInterval(id.interval):clearTimeout(id));ctl.raf.forEach(cancelAnimationFrame);ctl.listeners.forEach(([el,type,fn,opts])=>el.removeEventListener(type,fn,opts));if(active===ctl)active=null;};ctl.abort=(reason='The window lost focus during measurement. This block was discarded; select Begin Block to restart it. No invalid trials were saved.')=>{if(!ctl.running)return;ctl.clean();state.taskProgress.aborted=reason;render();if(!document.hidden){const msg=$('.error-note');if(msg){msg.tabIndex=-1;msg.focus({preventScroll:true});msg.scrollIntoView({block:'start',behavior:'instant'});}else focusScreen();}};active=ctl;return ctl;}
// During short mobile trials the learner must see both the stimulus and its
// distraction/response controls. A Begin click can otherwise leave the live
// content below the fold while the clock is already counting down.
// Scroll immediately (never animated) only when the active task is clipped.
// A short landscape window / high browser zoom can make part of a stimulus
// invisible even when the scroll position is optimal. Never record a timed
// result unless ALL essential parts fit simultaneously in the viewport.
// This changes scrolling and trial validity, not the experimental scoring.
function timedEssentials(){
 const panel=$('#active-task');
 if(!panel)return [];
 if(panel.querySelector('#word-stage'))return ['.word-grid','.memory-phone','.memory-timer'];
 if(panel.querySelector('#switch-count'))return ['#rule-cue','#shape-place','#left-key','#right-key'];
 if(panel.dataset.phase==='dual-preview'||panel.dataset.phase==='dual-running'){
   return panel.querySelector('#track-board')
     ? ['#track-board',...(panel.querySelector('#detect-btn')?['#detect-btn']:[])]
     : ['.countdown','#detect-btn'];
 }
 return [];
}
function keepTimedTaskVisible(){
 const panel=$('#active-task'),selectors=timedEssentials();
 if(!panel||!selectors.length)return true; // recall and untimed selection need no timed-fit gate
 const nodes=selectors.map(s=>panel.querySelector(s)).filter(Boolean);
 if(nodes.length!==selectors.length)return false;
 const bounds=()=>{
   const r=nodes.map(n=>n.getBoundingClientRect());
   return {top:Math.min(...r.map(x=>x.top)),bottom:Math.max(...r.map(x=>x.bottom))};
 };
 const pad=4,area=bounds();
 if(area.bottom-area.top>window.innerHeight-2*pad)return false;
 // Move only as much as necessary. Unlike v10, this can scroll UP when the
 // browser has clamped a taller panel to the bottom, hiding its first word.
 let delta=area.top<pad?area.top-pad:area.bottom>window.innerHeight-pad?area.bottom-(window.innerHeight-pad):0;
 if(Math.abs(delta)>1){
   const html=document.documentElement,prior=html.style.scrollBehavior;
   html.style.scrollBehavior='auto';window.scrollTo(0,Math.max(0,window.scrollY+delta));html.style.scrollBehavior=prior;
 }
 const after=bounds();
 return after.top>=-2&&after.bottom<=window.innerHeight+2;
}
function guardTimedViewport(){
 if(!active||!active.running)return;
 if(!keepTimedTaskVisible())active.abort('This screen cannot display the complete timed task at once. Rotate to portrait or use a larger view, then choose Begin round again. This round was discarded; no result was saved.');
}
function installViewportGuard(){
 const ctl=active;if(!ctl)return;
 // Mobile browser toolbars and orientation changes may resize during exposure.
 // A viewport change that STILL fits is harmless; one that clips stimuli
 // discards the partial block. Recall and target selection are not timed here.
 ctl.listen(window,'resize',()=>ctl.frame(()=>{if(ctl.running)guardTimedViewport();}));
 guardTimedViewport();
}

<script id="clean-guided-core">(()=>{'use strict';
const app=document.getElementById('app');if(!app)return;
const brand=document.querySelector('.logo strong');if(brand)brand.textContent='ATTENTION / LAB';
let started=false,lastHolder=null,holderWatcher=null,activeToastTimer=null,chimeContext=null;
window.CleanLabQA={alerts:0,vibrations:0};
// Minimal phone-like chime, triggered only by real scheduled notification DOM events.
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!chimeContext)chimeContext=new A();if(chimeContext.state==='suspended')chimeContext.resume().catch(()=>{});for(const [delay,hz] of [[0,860],[.13,1090]]){const at=chimeContext.currentTime+delay,osc=chimeContext.createOscillator(),gain=chimeContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.1,at+.012);gain.gain.exponentialRampToValueAtTime(.0001,at+.17);osc.connect(gain).connect(chimeContext.destination);osc.start(at);osc.stop(at+.19);}}catch(_){}}
function notify(){let n=lastHolder?.querySelector('.fake-push');if(!n)return;window.CleanLabQA.alerts++;
let el=document.getElementById('guided-alert-toast');if(!el){el=document.createElement('div');el.id='guided-alert-toast';el.className='guided-alert-toast';el.setAttribute('aria-hidden','true');document.body.append(el)}
const label=n.querySelector('b')?.textContent||'PHONE',message=n.querySelector('span')?.textContent||'New message';el.replaceChildren();const glyph=document.createElement('span');glyph.className='app-icon';glyph.textContent='●';const body=document.createElement('span'),head=document.createElement('strong');head.textContent=label;body.append(head,document.createTextNode(message));el.append(glyph,body);
el.classList.remove('visible');void el.offsetWidth;el.classList.add('visible');clearTimeout(activeToastTimer);activeToastTimer=setTimeout(()=>el.classList.remove('visible'),1650);
chime();try{if(typeof navigator.vibrate==='function'){window.CleanLabQA.vibrations++;navigator.vibrate([110,50,110]);}}catch(_){}
}
function checkPhone(){const el=app.querySelector('.memory-phone.is-live #notification-holder');if(el===lastHolder)return;if(holderWatcher)holderWatcher.disconnect();lastHolder=el;if(el){holderWatcher=new MutationObserver(()=>{if(el.querySelector('.fake-push'))notify()});holderWatcher.observe(el,{childList:true})}else document.getElementById('guided-alert-toast')?.classList.remove('visible')}
function update(){
 if(!started){const start=app.querySelector('#start');if(start){started=true;start.click();return}}
 const intro=app.querySelector('.lesson-intro'),predict=intro?.querySelector('.predict');if(predict){const chosen=!!predict.querySelector('.prediction.selected');const go=intro.querySelector('#start-experiment');if(go&&go.disabled===chosen)go.disabled=!chosen;
  // Original prediction comparison remains intact; no sample-data option.
  const small=predict.querySelector('small');if(small&&small.textContent.includes('No right answer'))small.textContent='Predict first. Then test it.';
 }
 const finish=app.querySelector('.finish');if(finish&&!finish.querySelector('#clean-core-next')){const link=document.createElement('a');link.id='clean-core-next';link.href='../index.html#04';link.className='clean-next';link.textContent='Next · Study 04 →';const actions=finish.querySelector('.finish-actions');(actions||finish).before(link)}
 checkPhone();
}
let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;update()})}).observe(app,{childList:true,subtree:true});update();
})();</script></body></html>
